version: '3.8'

services:
  # 1. MiniViT FastAPI Çıkarım Servisi
  minivit-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minivit-fastapi-service
    ports:
      - "8000:8000"
    environment:
      - CUBLAS_WORKSPACE_CONFIG=:4096:8
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Locust Yük ve Stres Testi Motoru
  locust-master:
    image: locustio/locust:2.15.0
    container_name: minivit-locust-loadtester
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --host http://minivit-api:8000
    depends_on:
      - minivit-api
